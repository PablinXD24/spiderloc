<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Tracker - Interface Retrô</title>
    <!-- Importando fonte pixelada para o estilo autêntico -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #0b1329;
            color: #d1f7ff;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container principal simulando o dispositivo/tela */
        .device-frame {
            width: 100vw;
            height: 100vh;
            max-width: 900px;
            max-height: 900px;
            background: #4a90e2;
            border: 8px solid #213865;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 12px;
        }

        /* Cabeçalho do Monitor */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 10;
        }

        .status-box {
            background: #ffb75e;
            color: #331a00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 8px 12px;
            border: 3px solid #7c3f00;
            box-shadow: 3px 3px 0px #213865;
            text-align: center;
            flex-grow: 1;
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-badge {
            background: #ffb75e;
            border: 3px solid #7c3f00;
            padding: 6px;
            box-shadow: 3px 3px 0px #213865;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* Área do Mapa Principal com suporte a Exame/Zoom/Pan */
        .map-viewport {
            flex-grow: 1;
            background: #0d1b2a;
            border: 4px solid #1b3a57;
            position: relative;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }

        .map-viewport:active {
            cursor: grabbing;
        }

        /* Camada interna estendida que simula o mapa navegável */
        .map-canvas-layer {
            position: absolute;
            width: 3000px;
            height: 3000px;
            top: -1000px;
            left: -1000px;
            background-color: #0b192c;
            /* Textura visual tática de mapa em grid */
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.07) 1px, transparent 1px),
                linear-gradient(rgba(41, 128, 185, 0.15) 2px, transparent 2px),
                linear-gradient(90deg, rgba(41, 128, 185, 0.15) 2px, transparent 2px);
            background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
            transform-origin: center center;
            will-change: transform;
        }

        /* Elementos visuais de referência geográfica no mapa */
        .map-landmark {
            position: absolute;
            border: 2px dashed rgba(0, 243, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }

        .landmark-center {
            width: 800px;
            height: 800px;
            top: 1100px;
            left: 1100px;
        }

        .landmark-outer {
            width: 1800px;
            height: 1800px;
            top: 600px;
            left: 600px;
            border-color: rgba(255, 183, 94, 0.1);
        }

        /* Marcadores de Usuários no Mapa */
        .user-marker {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #ff4757;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #ff4757;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            z-index: 5;
        }

        .user-marker.self {
            background: #2ed573;
            box-shadow: 0 0 18px #2ed573;
            z-index: 6;
        }

        .user-marker::after {
            content: attr(data-name);
            position: absolute;
            bottom: -20px;
            background: rgba(0,0,0,0.85);
            color: #d1f7ff;
            font-size: 9px;
            padding: 2px 5px;
            white-space: nowrap;
            border: 1px solid #1b3a57;
            border-radius: 3px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Barra Lateral de Comandos (Esquerda) */
        .side-toolbar {
            position: absolute;
            left: 18px;
            top: 70px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
        }

        .side-btn {
            background: #ff6b6b;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 8px;
            border: 2px solid #8b0000;
            box-shadow: 2px 2px 0px #213865;
            cursor: pointer;
            text-align: center;
        }

        /* Controles de Zoom Flutuantes no Mapa */
        .map-zoom-controls {
            position: absolute;
            right: 12px;
            bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
        }

        .zoom-btn {
            background: #ffb75e;
            color: #331a00;
            font-family: 'Press Start 2P', monospace;
            width: 32px;
            height: 32px;
            border: 2px solid #7c3f00;
            box-shadow: 2px 2px 0px #213865;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Painel de Controle Inferior */
        .bottom-panel {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .retro-btn {
            background: #ffdfba;
            color: #4a2e00;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 10px 4px;
            border: 3px solid #8c5821;
            box-shadow: 3px 3px 0px #213865;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s;
        }

        .retro-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #213865;
        }

        /* Mensagens de status do GPS */
        .gps-status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 10px;
            background: rgba(0,0,0,0.75);
            color: #d1f7ff;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #1b3a57;
            z-index: 10;
        }

        /* RESPONSIVIDADE ESPECIAL PARA MOBILE */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                height: 100vh;
                height: 100dvh;
            }

            .device-frame {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                max-width: none;
                max-height: none;
                border: none;
                box-shadow: none;
                padding: 6px;
            }

            .top-bar {
                margin-bottom: 6px;
            }

            .status-box {
                font-size: 8px;
                padding: 6px 8px;
            }

            .side-toolbar {
                left: 10px;
                top: 55px;
            }

            .side-btn {
                padding: 6px;
                font-size: 7px;
            }

            .bottom-panel {
                grid-template-columns: repeat(4, 1fr);
                gap: 5px;
                margin-top: 6px;
            }

            .retro-btn {
                font-size: 7px;
                padding: 8px 2px;
                border-width: 2px;
                box-shadow: 2px 2px 0px #213865;
            }

            .gps-status {
                font-size: 8px;
                top: 6px;
                right: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- INTERFACE PRINCIPAL -->
    <div class="device-frame">
        <!-- Barra Superior -->
        <div class="top-bar">
            <div class="icon-badge">🌐</div>
            <div class="status-box" id="statusMessage">SISTEMA ATIVO - RASTREAMENTO DIRETO</div>
            <div class="icon-badge">🕷️</div>
        </div>

        <!-- Menu Lateral Esquerdo -->
        <div class="side-toolbar">
            <button class="side-btn">0</button>
            <button class="side-btn">S</button>
            <button class="side-btn">T</button>
        </div>

        <!-- Tela do Mapa com suporte a exames (Pan & Zoom) -->
        <div class="map-viewport" id="mapViewport">
            <div class="gps-status" id="gpsStatus">GPS: Buscando sinal...</div>
            
            <div class="map-canvas-layer" id="mapCanvasLayer">
                <!-- Referências visuais do mapa tático -->
                <div class="map-landmark landmark-center"></div>
                <div class="map-landmark landmark-outer"></div>
                
                <!-- Marcadores injetados dinamicamente no centro exato do canvas -->
                <div id="markersContainer"></div>
            </div>

            <!-- Controles de Zoom na interface -->
            <div class="map-zoom-controls">
                <button class="zoom-btn" onclick="zoomIn()">+</button>
                <button class="zoom-btn" onclick="zoomOut()">-</button>
            </div>
        </div>

        <!-- Painel de Controle Inferior -->
        <div class="bottom-panel">
            <button class="retro-btn" onclick="setTerrainMode()">TERRAIN</button>
            <button class="retro-btn" onclick="toggleView3D()">3D VIEW</button>
            <button class="retro-btn" onclick="centerOnMe()">CENTER LOC</button>
            <button class="retro-btn" onclick="openChat()">CHAT</button>
            <button class="retro-btn">PROF 1</button>
            <button class="retro-btn">PROF 2</button>
            <button class="retro-btn" onclick="openArchive()">ARCHIVE</button>
            <button class="retro-btn" onclick="shareLocation()">SHARE</button>
        </div>
    </div>

    <!-- Firebase SDKs e Lógica de Localização -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // CONFIGURAÇÃO DO FIREBASE (INSIRA SEUS DADOS)
        // ==========================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "SEU_AUTH_DOMAIN_AQUI",
            databaseURL: "SEU_DATABASE_URL_AQUI",
            projectId: "SEU_PROJECT_ID_AQUI",
            storageBucket: "SEU_STORAGE_BUCKET_AQUI",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.warn("Firebase não configurado. Executando em modo de simulação local.");
        }

        const currentHeroUid = 'heroi_' + Math.random().toString(36).substring(2, 9);
        const currentHeroName = 'Herói-' + Math.floor(Math.random() * 900 + 100);

        document.getElementById('statusMessage').innerText = `IDENTIDADE: ${currentHeroName.toUpperCase()}`;

        startRealtimeLocationTracking();
        listenToAllUsersLocations();

        function startRealtimeLocationTracking() {
            const gpsStatus = document.getElementById('gpsStatus');
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        gpsStatus.innerText = `GPS: ATIVO`;

                        if (db) {
                            set(ref(db, 'locations/' + currentHeroUid), {
                                name: currentHeroName,
                                latitude: lat,
                                longitude: lng,
                                timestamp: Date.now()
                            });
                        } else {
                            updateLocalMarkerSimulation(currentHeroUid, currentHeroName, lat, lng);
                        }
                    },
                    (error) => {
                        gpsStatus.innerText = "GPS: ERRO";
                        console.error(error);
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                gpsStatus.innerText = "GPS: INDISPONÍVEL";
            }
        }

        function listenToAllUsersLocations() {
            if (!db) return;
            const locationsRef = ref(db, 'locations/');
            onValue(locationsRef, (snapshot) => {
                const data = snapshot.val();
                const container = document.getElementById('markersContainer');
                container.innerHTML = '';

                if (data) {
                    Object.keys(data).forEach(uid => {
                        const user = data[uid];
                        renderMarker(uid, user.name, user.latitude, user.longitude, uid === currentHeroUid);
                    });
                }
            });
        }

        function renderMarker(uid, name, lat, lng, isSelf) {
            const container = document.getElementById('markersContainer');
            
            const marker = document.createElement('div');
            marker.className = `user-marker ${isSelf ? 'self' : ''}`;
            marker.setAttribute('data-name', name);
            marker.innerHTML = isSelf ? '⭐' : '📍';

            // Posiciona os marcadores tendo como referência o centro exato da grande camada de mapa (1500px, 1500px)
            const centerX = 1500;
            const centerY = 1500;
            
            // Fator de escala para coordenadas relativas ao mapa
            const offsetX = (lng % 1) * 400;
            const offsetY = (lat % 1) * 400;

            marker.style.left = `${centerX + offsetX}px`;
            marker.style.top = `${centerY + offsetY}px`;

            container.appendChild(marker);
        }

        const simulatedUsers = {};
        function updateLocalMarkerSimulation(uid, name, lat, lng) {
            simulatedUsers[uid] = { name, latitude: lat, longitude: lng };
            const container = document.getElementById('markersContainer');
            container.innerHTML = '';

            // Adiciona pontos de referência estáticos/simulados no mapa
            renderMarker('mock_vigilante', 'Vigilante-X', -23.55, -46.63, false);
            renderMarker('mock_base', 'Base Central', 0, 0, false);

            Object.keys(simulatedUsers).forEach(id => {
                const u = simulatedUsers[id];
                renderMarker(id, u.name, u.latitude, u.longitude, id === currentHeroUid);
            });
        }
    </script>

    <!-- Controle de Pan, Zoom e Navegação Estilo Mapa Digital -->
    <script>
        const viewport = document.getElementById('mapViewport');
        const canvasLayer = document.getElementById('mapCanvasLayer');

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        function updateTransform() {
            canvasLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        // Eventos de Arrastar (Mouse e Touch para Mobile)
        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            panX = e.touches[0].clientX - startX;
            panY = e.touches[0].clientY - startY;
            updateTransform();
        });

        viewport.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Zoom por Botões e Scroll do Mouse
        function zoomIn() {
            scale = Math.min(scale + 0.25, 3.0);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale - 0.25, 0.5);
            updateTransform();
        }

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                zoomIn();
            } else {
                zoomOut();
            }
        }, { passive: false });

        // Funções Originais dos Botões Mantidas
        function setTerrainMode() { alert("Modo de Terreno ativado!"); }
        function toggleView3D() { alert("Alternando para visualização 3D..."); }
        function centerOnMe() { 
            panX = 0; 
            panY = 0; 
            scale = 1; 
            updateTransform();
            alert("Centralizando na sua localização exata."); 
        }
        function openChat() { alert("Canal de chat aberto."); }
        function openArchive() { alert("Arquivos abertos."); }
        function shareLocation() { alert("Link copiado para compartilhamento!"); }
    </script>
</body>
</html>
