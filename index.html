<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Tracker - Interface Retrô</title>
    <!-- Importando fonte pixelada e fontes padrão -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Leaflet CSS para o mapa funcional -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            background-color: #0b1329;
            color: #d1f7ff;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* Container principal simulando o dispositivo/tela */
        .device-frame {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 900px;
            max-height: 900px;
            background: #4a90e2;
            border: 8px solid #213865;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 12px;
        }

        /* Cabeçalho do Monitor */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 10;
        }

        .status-box {
            background: #ffb75e;
            color: #331a00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 8px 12px;
            border: 3px solid #7c3f00;
            box-shadow: 3px 3px 0px #213865;
            text-align: center;
            flex-grow: 1;
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-badge {
            background: #ffb75e;
            border: 3px solid #7c3f00;
            padding: 6px;
            box-shadow: 3px 3px 0px #213865;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* Área do Mapa Funcional */
        .map-viewport {
            flex-grow: 1;
            background: #0d1b2a;
            border: 4px solid #1b3a57;
            position: relative;
            overflow: hidden;
            touch-action: pan-x pan-y pinch-zoom;
        }

        #leafletMap {
            width: 100%;
            height: 100%;
            background: #0b192c;
            z-index: 1;
        }

        .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(1.5) hue-rotate(180deg) saturate(0.8) !important;
        }

        .custom-retro-marker {
            background: transparent;
            border: none;
        }

        .marker-pin {
            width: 24px;
            height: 24px;
            background: #ff4757;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff4757;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .marker-pin.self {
            background: #2ed573;
            box-shadow: 0 0 15px #2ed573;
        }

        .marker-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #d1f7ff;
            font-size: 8px;
            padding: 2px 4px;
            white-space: nowrap;
            border: 1px solid #1b3a57;
            border-radius: 2px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Barra Lateral de Comandos (Esquerda) */
        .side-toolbar {
            position: absolute;
            left: 18px;
            top: 70px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
        }

        .side-btn {
            background: #ff6b6b;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 8px;
            border: 2px solid #8b0000;
            box-shadow: 2px 2px 0px #213865;
            cursor: pointer;
            text-align: center;
        }

        /* Controles de Zoom Estilizados Retrô */
        .retro-zoom-control {
            position: absolute;
            right: 12px;
            bottom: 130px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
        }

        .zoom-btn {
            background: #ffdfba;
            color: #4a2e00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            width: 32px;
            height: 32px;
            border: 3px solid #8c5821;
            box-shadow: 2px 2px 0px #213865;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #213865;
        }

        /* Mini-mapa Teia de Aranha Poligonal (Exato à referência) */
        .spider-minimap {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: 115px;
            height: 115px;
            background: #040e1b;
            clip-path: polygon(
                30% 0%, 70% 0%, 
                100% 30%, 100% 70%, 
                70% 100%, 30% 100%, 
                0% 70%, 0% 30%
            );
            border: 3px solid #1b3a57;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .spider-web-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .spider-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #e74c3c;
            border-radius: 50%;
            box-shadow: 0 0 4px #e74c3c;
        }

        .spider-dot.self-dot {
            background: #2ecc71;
            width: 5px;
            height: 5px;
            box-shadow: 0 0 6px #2ecc71;
            z-index: 2;
        }

        /* Painel de Controle Inferior */
        .bottom-panel {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        /* Bloco dos Avatares à Esquerda */
        .avatar-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
            padding-left: 4px;
        }

        .avatar-box-top {
            width: 44px;
            height: 44px;
            background: #ff6b4a;
            border: 3px solid #8b2500;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px #1c355e;
            font-size: 18px;
        }

        .avatar-box-main {
            width: 52px;
            height: 64px;
            background: #ff7657;
            border: 3px solid #8b2500;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px #1c355e;
            position: relative;
        }

        /* Grade de Botões */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, auto);
            gap: 6px;
            justify-content: flex-end;
            flex-grow: 1;
        }

        /* ========================================================
           ESTILO DE PIXEL COM CANTOS ARREDONDADOS/PIXEL SOZINHO NOS CANTOS
           ======================================================== */
        .pill-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 8px 10px;
            margin: 3px;
            shape-rendering: crispEdges;
            border: 0;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            letter-spacing: -0.5px;
            box-shadow:
                0px 3px black,
                0px -3px black,
                3px 0px black,
                -3px 0px black,
                1px 2px black,
                -1px 2px black,
                1px -2px black,
                -1px -2px black,
                2px 1px black,
                -2px 1px black,
                2px -1px black,
                -2px -1px black,
                0px 6px #00000038,
                3px 3px #00000038,
                -3px 3px #00000038,
                inset 0px 3px #ffffff36;
        }

        .pill-btn:active {
            transform: translateY(3px);
            box-shadow:
                0px 3px black,
                0px -3px black,
                3px 0px black,
                -3px 0px black,
                1px 2px black,
                -1px 2px black,
                1px -2px black,
                -1px -2px black,
                2px 1px black,
                -2px 1px black,
                2px -1px black,
                -2px -1px black,
                inset 0px 3px #00000038;
        }

        /* Cores aplicadas ao estilo Pixel */
        .pill-green-dark {
            --color: #ffffff;
            --bg-color: #27ae60;
            color: var(--color);
            background-color: var(--bg-color);
        }

        .pill-green {
            --color: #0b381e;
            --bg-color: #2ecc71;
            color: var(--color);
            background-color: var(--bg-color);
        }

        .pill-red {
            --color: #ffffff;
            --bg-color: #e74c3c;
            color: var(--color);
            background-color: var(--bg-color);
        }

        .pill-outline {
            --color: transparent;
            --bg-color: transparent;
            color: var(--color);
            background-color: var(--bg-color);
            box-shadow: none !important;
            cursor: default;
            border: 0 !important;
        }
        .pill-outline:active {
            transform: none !important;
            box-shadow: none !important;
        }

        .pill-orange {
            --color: #3b2300;
            --bg-color: #f39c12;
            color: var(--color);
            background-color: var(--bg-color);
        }

        .pill-disabled {
            --color: #b0bec5;
            --bg-color: #4f6475;
            color: var(--color);
            background-color: var(--bg-color);
            cursor: not-allowed;
            box-shadow:
                0px 3px #1a2327,
                0px -3px #1a2327,
                3px 0px #1a2327,
                -3px 0px #1a2327,
                1px 2px #1a2327,
                -1px 2px #1a2327,
                1px -2px #1a2327,
                -1px -2px #1a2327,
                2px 1px #1a2327,
                -2px 1px #1a2327,
                2px -1px #1a2327,
                -2px -1px #1a2327;
        }
        .pill-disabled:active {
            transform: none;
            box-shadow:
                0px 3px #1a2327,
                0px -3px #1a2327,
                3px 0px #1a2327,
                -3px 0px #1a2327,
                1px 2px #1a2327,
                -1px 2px #1a2327,
                1px -2px #1a2327,
                -1px -2px #1a2327,
                2px 1px #1a2327,
                -2px 1px #1a2327,
                2px -1px #1a2327,
                -2px -1px #1a2327;
        }

        /* Mensagens de status do GPS */
        .gps-status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 10px;
            background: rgba(0,0,0,0.75);
            color: #d1f7ff;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #1b3a57;
            z-index: 1000;
        }

        /* Sistema de Notificações Retrô na Interface */
        #retroNotificationModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 41, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .retro-modal-box {
            background: #1b3a57;
            border: 4px solid #ffb75e;
            box-shadow: 6px 6px 0px #0b1329;
            width: 100%;
            max-width: 360px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-family: 'Share Tech Mono', monospace;
        }

        .retro-modal-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #ffb75e;
            text-align: center;
            border-bottom: 2px dashed #ffb75e;
            padding-bottom: 8px;
        }

        .retro-modal-content {
            font-size: 12px;
            color: #d1f7ff;
            text-align: center;
            line-height: 1.4;
            word-break: break-all;
        }

        .retro-modal-btn {
            background: #ff6b6b;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 10px;
            border: 2px solid #8b0000;
            box-shadow: 2px 2px 0px #0b1329;
            cursor: pointer;
            text-align: center;
            margin-top: 4px;
        }

        .retro-modal-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #0b1329;
        }

        /* RESPONSIVIDADE ESPECIAL PARA MOBILE */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                height: 100vh;
                height: 100dvh;
            }

            .device-frame {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                max-width: none;
                max-height: none;
                border: none;
                box-shadow: none;
                padding: 6px;
            }

            .top-bar {
                margin-bottom: 6px;
            }

            .status-box {
                font-size: 8px;
                padding: 6px 8px;
            }

            .side-toolbar {
                left: 10px;
                top: 55px;
            }

            .side-btn {
                padding: 6px;
                font-size: 7px;
            }

            .retro-zoom-control {
                right: 8px;
                bottom: 120px;
            }

            .zoom-btn {
                width: 34px;
                height: 34px;
                font-size: 11px;
            }

            .spider-minimap {
                width: 95px;
                height: 95px;
                right: 10px;
                bottom: 10px;
            }

            .bottom-panel {
                gap: 4px;
                margin-top: 6px;
            }

            .avatar-section {
                gap: 4px;
            }

            .avatar-box-top {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .avatar-box-main {
                width: 42px;
                height: 52px;
            }

            .buttons-grid {
                gap: 4px;
            }

            .pill-btn {
                font-size: 5px;
                padding: 6px 5px;
                margin: 2px;
                box-shadow:
                    0px 2px black,
                    0px -2px black,
                    2px 0px black,
                    -2px 0px black,
                    1px 1px black,
                    -1px 1px black,
                    1px -1px black,
                    -1px -1px black,
                    0px 4px #00000038,
                    2px 2px #00000038,
                    -2px 2px #00000038,
                    inset 0px 2px #ffffff36;
            }

            .pill-btn:active {
                transform: translateY(2px);
                box-shadow:
                    0px 2px black,
                    0px -2px black,
                    2px 0px black,
                    -2px 0px black,
                    1px 1px black,
                    -1px 1px black,
                    1px -1px black,
                    -1px -1px black,
                    inset 0px 2px #ffffff36;
            }

            .gps-status {
                font-size: 8px;
                top: 6px;
                right: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- INTERFACE PRINCIPAL -->
    <div class="device-frame">
        <!-- Barra Superior -->
        <div class="top-bar">
            <div class="icon-badge">🌐</div>
            <div class="status-box" id="statusMessage">SISTEMA ATIVO - RASTREAMENTO DIRETO</div>
            <div class="icon-badge">🕷️</div>
        </div>

        <!-- Menu Lateral Esquerdo -->
        <div class="side-toolbar">
            <button class="side-btn">0</button>
            <button class="side-btn">S</button>
            <button class="side-btn">T</button>
        </div>

        <!-- Tela do Mapa Funcional (Leaflet) -->
        <div class="map-viewport">
            <div class="gps-status" id="gpsStatus">GPS: Buscando sinal...</div>
            <div id="leafletMap"></div>

            <!-- Controles de Zoom Personalizados Retrô -->
            <div class="retro-zoom-control">
                <button class="zoom-btn" onclick="zoomIn()">+</button>
                <button class="zoom-btn" onclick="zoomOut()">-</button>
            </div>

            <!-- Mini-mapa Teia de Aranha (Canto Direito Inferior) -->
            <div class="spider-minimap" id="spiderMinimap" onclick="centerOnMe()" title="Radar Teia de Aranha">
                <svg class="spider-web-svg" viewBox="0 0 100 100">
                    <!-- Linhas radiais -->
                    <line x1="50" y1="50" x2="50" y2="0" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="50" y2="100" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="0" y2="50" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="100" y2="50" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="15" y2="15" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="85" y2="85" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="15" y2="85" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="85" y2="15" stroke="#1b3a57" stroke-width="0.8"/>
                    <!-- Polígonos concêntricos simulando a teia exata da referência -->
                    <polygon points="50,40 58,42 60,50 58,58 50,60 42,58 40,50 42,42" fill="none" stroke="#1b3a57" stroke-width="0.8"/>
                    <polygon points="50,28 68,32 72,50 68,68 50,72 32,68 28,50 32,32" fill="none" stroke="#1b3a57" stroke-width="0.8"/>
                    <polygon points="50,15 78,22 85,50 78,78 50,85 22,78 15,50 22,22" fill="none" stroke="#1b3a57" stroke-width="0.8"/>
                    <polygon points="50,2 90,10 98,50 90,90 50,98 10,90 2,50 10,10" fill="none" stroke="#21486c" stroke-width="1.2"/>
                </svg>
                <!-- Marcadores dinâmicos no radar -->
                <div class="spider-dot self-dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
            </div>
        </div>

        <!-- Painel Inferior com Avatares à Esquerda e Botões à Direita -->
        <div class="bottom-panel">
            <!-- Avatares à Esquerda -->
            <div class="avatar-section">
                <div class="avatar-box-top">🍅</div>
                <div class="avatar-box-main">🦸‍♂️</div>
            </div>

            <!-- Grade de Botões à Direita -->
            <div class="buttons-grid">
                <!-- Linha 1 -->
                <button class="pill-btn pill-green-dark" onclick="setAlias('A.1')">A.1</button>
                <button class="pill-btn pill-green" onclick="setProf(1)">PROF 1</button>
                <button class="pill-btn pill-orange" onclick="setTerrainMode()">TERRAIN</button>
                <button class="pill-btn pill-orange" onclick="openChat()">CHAT</button>

                <!-- Linha 2 -->
                <button class="pill-btn pill-red" onclick="setAlias('A.2')">A.2</button>
                <button class="pill-btn pill-green" onclick="setProf(2)">PROF 2</button>
                <button class="pill-btn pill-disabled" onclick="toggleView3D()">3D VIEW</button>
                <button class="pill-btn pill-orange" onclick="openArchive()">ARCHIVE</button>

                <!-- Linha 3 -->
                <button class="pill-btn pill-outline"></button>
                <button class="pill-btn pill-green" onclick="setProf(3)">PROF 3</button>
                <button class="pill-btn pill-orange" onclick="centerOnMe()">CENTER LOC.</button>
                <button class="pill-btn pill-orange" onclick="shareLocation()">SHARE</button>
            </div>
        </div>
    </div>

    <!-- Modal de Notificação Retrô integrado à interface -->
    <div id="retroNotificationModal">
        <div class="retro-modal-box">
            <div class="retro-modal-title">TERMINAL NOTIFICAÇÃO</div>
            <div class="retro-modal-content" id="retroModalText">Mensagem do sistema</div>
            <button class="retro-modal-btn" onclick="closeRetroModal()">OK</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Firebase SDKs e Lógica do Mapa Funcional -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // CONFIGURAÇÃO DO FIREBASE (INSIRA SEUS DADOS)
        // ==========================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "SEU_AUTH_DOMAIN_AQUI",
            databaseURL: "SEU_DATABASE_URL_AQUI",
            projectId: "SEU_PROJECT_ID_AQUI",
            storageBucket: "SEU_STORAGE_BUCKET_AQUI",
            messagingSenderId: "SUA_MESSAGING_SENDER_ID",
            appId: "SUA_APP_ID"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.warn("Firebase não configurado. Executando em modo de simulação local.");
        }

        const currentHeroUid = 'heroi_' + Math.random().toString(36).substring(2, 9);
        const currentHeroName = 'Herói-' + Math.floor(Math.random() * 900 + 100);

        document.getElementById('statusMessage').innerText = `IDENTIDADE: ${currentHeroName.toUpperCase()}`;

        // Inicializa o Mapa Leaflet com coordenadas padrão otimizadas para toque mobile
        const map = L.map('leafletMap', {
            zoomControl: false,
            attributionControl: false,
            tap: true,
            dragging: true,
            touchZoom: true,
            scrollWheelZoom: true
        }).setView([-23.55052, -46.633308], 14);

        // Funções de Zoom globais para os botões estilizados
        window.zoomIn = function() {
            map.zoomIn();
        }
        window.zoomOut = function() {
            map.zoomOut();
        }

        // Camada padrão (Escura / Retrô)
        const darkTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        });
        darkTileLayer.addTo(map);

        // Alternância de Camada de Terreno Real (Satélite / Esdark)
        let isTerrainActive = false;
        window.setTerrainMode = function() {
            isTerrainActive = !isTerrainActive;
            if (isTerrainActive) {
                map.removeLayer(darkTileLayer);
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19,
                }).addTo(map);
                showRetroModal("Modo Terrain (Satélite) ativado com sucesso!");
            } else {
                location.reload(); // Restaura o mapa padrão do sistema
            }
        };

        const markersLayer = L.layerGroup().addTo(map);
        let myCurrentLatLng = null;
        let allUsersData = {};

        startRealtimeLocationTracking();
        listenToAllUsersLocations();

        function startRealtimeLocationTracking() {
            const gpsStatus = document.getElementById('gpsStatus');
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        myCurrentLatLng = [lat, lng];
                        gpsStatus.innerText = `GPS: ATIVO`;

                        if (db) {
                            set(ref(db, 'locations/' + currentHeroUid), {
                                name: currentHeroName,
                                latitude: lat,
                                longitude: lng,
                                timestamp: Date.now()
                            });
                        } else {
                            updateLocalMarkerSimulation(currentHeroUid, currentHeroName, lat, lng);
                        }
                    },
                    (error) => {
                        gpsStatus.innerText = "GPS: ERRO";
                        console.error(error);
                        myCurrentLatLng = [-23.55052, -46.633308];
                        updateLocalMarkerSimulation(currentHeroUid, currentHeroName, -23.55052, -46.633308);
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                gpsStatus.innerText = "GPS: INDISPONÍVEL";
                myCurrentLatLng = [-23.55052, -46.633308];
                updateLocalMarkerSimulation(currentHeroUid, currentHeroName, -23.55052, -46.633308);
            }
        }

        function listenToAllUsersLocations() {
            if (!db) return;
            const locationsRef = ref(db, 'locations/');
            onValue(locationsRef, (snapshot) => {
                const data = snapshot.val();
                markersLayer.clearLayers();
                allUsersData = {};

                if (data) {
                    Object.keys(data).forEach(uid => {
                        const user = data[uid];
                        allUsersData[uid] = user;
                        renderMarker(uid, user.name, user.latitude, user.longitude, uid === currentHeroUid);
                    });
                    updateSpiderMinimap();
                }
            });
        }

        function renderMarker(uid, name, lat, lng, isSelf) {
            const iconHtml = `
                <div class="marker-pin ${isSelf ? 'self' : ''}">
                    ${isSelf ? '⭐' : '📍'}
                    <div class="marker-label">${name}</div>
                </div>
            `;

            const customIcon = L.divIcon({
                className: 'custom-retro-marker',
                html: iconHtml,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            const marker = L.marker([lat, lng], { icon: customIcon });
            markersLayer.addLayer(marker);

            if (isSelf && !window.hasCenteredInitial) {
                map.setView([lat, lng], 15);
                window.hasCenteredInitial = true;
            }
        }

        const simulatedUsers = {};
        function updateLocalMarkerSimulation(uid, name, lat, lng) {
            simulatedUsers[uid] = { name, latitude: lat, longitude: lng };
            allUsersData = { ...simulatedUsers };
            markersLayer.clearLayers();

            renderMarker('mock_vigilante', 'Vigilante-X', lat + 0.005, lng + 0.005, false);
            allUsersData['mock_vigilante'] = { name: 'Vigilante-X', latitude: lat + 0.005, longitude: lng + 0.005 };

            Object.keys(simulatedUsers).forEach(id => {
                const u = simulatedUsers[id];
                renderMarker(id, u.name, u.latitude, u.longitude, id === currentHeroUid);
            });
            updateSpiderMinimap();
        }

        function updateSpiderMinimap() {
            const minimap = document.getElementById('spiderMinimap');
            const existingDots = minimap.querySelectorAll('.spider-dot:not(.self-dot)');
            existingDots.forEach(d => d.remove());

            if (!myCurrentLatLng) return;

            const [myLat, myLng] = myCurrentLatLng;
            const scaleFactor = 3500;

            Object.keys(allUsersData).forEach(uid => {
                if (uid === currentHeroUid) return;
                const user = allUsersData[uid];
                
                const dLat = (user.latitude - myLat) * scaleFactor;
                const dLng = (user.longitude - myLng) * scaleFactor;

                let posX = 50 + dLng;
                let posY = 50 - dLat;

                posX = Math.max(8, Math.min(92, posX));
                posY = Math.max(8, Math.min(92, posY));

                const dot = document.createElement('div');
                dot.className = 'spider-dot';
                dot.style.left = `${posX}%`;
                dot.style.top = `${posY}%`;
                dot.title = user.name;
                minimap.appendChild(dot);
            });
        }

        window.centerOnMe = function() {
            if (myCurrentLatLng) {
                map.setView(myCurrentLatLng, 16, { animate: true });
                showRetroModal("Centralizando na sua localização exata.");
            } else {
                showRetroModal("Aguardando sinal do GPS...");
            }
        };
    </script>

    <!-- Funções dos Botões Atualizadas com Notificações na Interface -->
    <script>
        function showRetroModal(message) {
            document.getElementById('retroModalText').innerText = message;
            document.getElementById('retroNotificationModal').style.display = 'flex';
        }

        function closeRetroModal() {
            document.getElementById('retroNotificationModal').style.display = 'none';
        }

        function setAlias(alias) { 
            showRetroModal(`Alias corporativo alterado para: ${alias}`); 
        }

        function setProf(profNum) { 
            let profileNames = { 1: "Operacional Tático", 2: "Furtivo / Invisível", 3: "Busca de Resgate" };
            showRetroModal(`Perfil de Rastreamento ${profNum} (${profileNames[profNum] || 'Padrão'}) ativado!`); 
        }

        function toggleView3D() { 
            showRetroModal("Visualização 3D desativada no momento."); 
        }

        function openChat() { 
            showRetroModal("Canal de chat seguro aberto com a central de heróis."); 
        }

        function openArchive() { 
            showRetroModal("Arquivos confidenciais de missões abertos."); 
        }

        function shareLocation() { 
            if (navigator.clipboard && window.location.href) {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    showRetroModal("Link de rastreamento copiado para a área de transferência!");
                }).catch(() => {
                    showRetroModal("Link gerado: " + window.location.href);
                });
            } else {
                showRetroModal("Link gerado com sucesso para compartilhamento.");
            }
        }
    </script>
</body>
</html>
