<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Tracker - Interface Retrô</title>
    <!-- Importando fonte pixelada e fontes padrão -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Leaflet CSS para o mapa funcional -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            background-color: #0b1329;
            color: #d1f7ff;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* Container principal simulando o dispositivo/tela */
        .device-frame {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 900px;
            max-height: 900px;
            background: #4a90e2;
            border: 8px solid #213865;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 12px;
        }

        /* Cabeçalho do Monitor */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 10;
        }

        .status-box {
            background: #ffb75e;
            color: #331a00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 8px 12px;
            border: 3px solid #7c3f00;
            box-shadow: 3px 3px 0px #213865;
            text-align: center;
            flex-grow: 1;
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-badge {
            background: #ffb75e;
            border: 3px solid #7c3f00;
            padding: 6px;
            box-shadow: 3px 3px 0px #213865;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* Área do Mapa Funcional */
        .map-viewport {
            flex-grow: 1;
            background: #0d1b2a;
            border: 4px solid #1b3a57;
            position: relative;
            overflow: hidden;
            touch-action: pan-x pan-y pinch-zoom;
        }

        #leafletMap {
            width: 100%;
            height: 100%;
            background: #0b192c;
            z-index: 1;
        }

        .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(1.5) hue-rotate(180deg) saturate(0.8) !important;
        }

        .custom-retro-marker {
            background: transparent;
            border: none;
        }

        .marker-pin {
            width: 24px;
            height: 24px;
            background: #ff4757;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff4757;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .marker-pin.self {
            background: #2ed573;
            box-shadow: 0 0 15px #2ed573;
        }

        .marker-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #d1f7ff;
            font-size: 8px;
            padding: 2px 4px;
            white-space: nowrap;
            border: 1px solid #1b3a57;
            border-radius: 2px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Barra Lateral de Comandos (Esquerda) */
        .side-toolbar {
            position: absolute;
            left: 18px;
            top: 70px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
        }

        .side-btn {
            background: #ff6b6b;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 8px;
            border: 2px solid #8b0000;
            box-shadow: 2px 2px 0px #213865;
            cursor: pointer;
            text-align: center;
        }

        .side-btn.btn-logout {
            background: #1b3a57;
            border: 2px solid #0a192f;
        }

        /* Controles de Zoom Estilizados Retrô */
        .retro-zoom-control {
            position: absolute;
            right: 12px;
            bottom: 130px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
        }

        .zoom-btn {
            background: #ffdfba;
            color: #4a2e00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            width: 32px;
            height: 32px;
            border: 3px solid #8c5821;
            box-shadow: 2px 2px 0px #213865;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-btn:active, .side-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #213865;
        }

        /* Mini-mapa Teia de Aranha Poligonal */
        .spider-minimap {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: 115px;
            height: 115px;
            background: #040e1b;
            clip-path: polygon(
                30% 0%, 70% 0%, 
                100% 30%, 100% 70%, 
                70% 100%, 30% 100%, 
                0% 70%, 0% 30%
            );
            border: 3px solid #1b3a57;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .spider-web-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .spider-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #e74c3c;
            border-radius: 50%;
            box-shadow: 0 0 4px #e74c3c;
        }

        .spider-dot.self-dot {
            background: #2ecc71;
            width: 5px;
            height: 5px;
            box-shadow: 0 0 6px #2ecc71;
            z-index: 2;
        }

        /* Painel de Controle Inferior */
        .bottom-panel {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        /* Bloco dos Avatares à Esquerda */
        .avatar-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
            padding-left: 4px;
        }

        .avatar-box-top {
            width: 44px;
            height: 44px;
            background: #ff6b4a;
            border: 3px solid #8b2500;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px #1c355e;
            font-size: 18px;
        }

        .avatar-box-main {
            width: 52px;
            height: 64px;
            background: #ff7657;
            border: 3px solid #8b2500;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px #1c355e;
            position: relative;
        }

        /* Grade de Botões */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, auto);
            gap: 6px;
            justify-content: flex-end;
            flex-grow: 1;
        }

        /* ESTILO DE PIXEL COM CANTOS ARREDONDADOS/PIXEL SOZINHO NOS CANTOS */
        .pill-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 8px 10px;
            margin: 3px;
            shape-rendering: crispEdges;
            border: 0;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            letter-spacing: -0.5px;
            box-shadow:
                0px 3px black, 0px -3px black, 3px 0px black, -3px 0px black,
                1px 2px black, -1px 2px black, 1px -2px black, -1px -2px black,
                2px 1px black, -2px 1px black, 2px -1px black, -2px -1px black,
                0px 6px #00000038, 3px 3px #00000038, -3px 3px #00000038,
                inset 0px 3px #ffffff36;
        }

        .pill-btn:active {
            transform: translateY(3px);
            box-shadow:
                0px 3px black, 0px -3px black, 3px 0px black, -3px 0px black,
                1px 2px black, -1px 2px black, 1px -2px black, -1px -2px black,
                2px 1px black, -2px 1px black, 2px -1px black, -2px -1px black,
                inset 0px 3px #00000038;
        }

        .pill-green-dark { --color: #ffffff; --bg-color: #27ae60; color: var(--color); background-color: var(--bg-color); }
        .pill-green { --color: #0b381e; --bg-color: #2ecc71; color: var(--color); background-color: var(--bg-color); }
        .pill-red { --color: #ffffff; --bg-color: #e74c3c; color: var(--color); background-color: var(--bg-color); }
        .pill-outline { --color: transparent; --bg-color: transparent; color: var(--color); background-color: var(--bg-color); box-shadow: none !important; cursor: default; border: 0 !important; }
        .pill-outline:active { transform: none !important; box-shadow: none !important; }
        .pill-orange { --color: #3b2300; --bg-color: #f39c12; color: var(--color); background-color: var(--bg-color); }
        .pill-disabled { --color: #b0bec5; --bg-color: #4f6475; color: var(--color); background-color: var(--bg-color); cursor: not-allowed; box-shadow: 0px 3px #1a2327, 0px -3px #1a2327, 3px 0px #1a2327, -3px 0px #1a2327, 1px 2px #1a2327, -1px 2px #1a2327, 1px -2px #1a2327, -1px -2px #1a2327, 2px 1px #1a2327, -2px 1px #1a2327, 2px -1px #1a2327, -2px -1px #1a2327; }
        .pill-disabled:active { transform: none; box-shadow: 0px 3px #1a2327, 0px -3px #1a2327, 3px 0px #1a2327, -3px 0px #1a2327, 1px 2px #1a2327, -1px 2px #1a2327, 1px -2px #1a2327, -1px -2px #1a2327, 2px 1px #1a2327, -2px 1px #1a2327, 2px -1px #1a2327, -2px -1px #1a2327; }

        /* Mensagens de status do GPS */
        .gps-status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 10px;
            background: rgba(0,0,0,0.75);
            color: #d1f7ff;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #1b3a57;
            z-index: 1000;
        }

        /* Sistema de Notificações Retrô e Modais */
        #retroNotificationModal, #authScreen, #nametagScreen, #profileScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 41, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        /* O Modal de Autenticação tem z-index maior para cobrir tudo até logar */
        #authScreen {
            z-index: 3000;
            display: flex; /* Visível por padrão antes de autenticar */
        }
        
        #nametagScreen, #profileScreen {
            z-index: 2500;
        }

        .retro-modal-box {
            background: #1b3a57;
            border: 4px solid #ffb75e;
            box-shadow: 6px 6px 0px #0b1329;
            width: 100%;
            max-width: 360px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-family: 'Share Tech Mono', monospace;
        }

        .retro-modal-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #ffb75e;
            text-align: center;
            border-bottom: 2px dashed #ffb75e;
            padding-bottom: 8px;
        }

        .retro-modal-content {
            font-size: 12px;
            color: #d1f7ff;
            text-align: center;
            line-height: 1.4;
            word-break: break-all;
        }

        .retro-input {
            background: #0b1329;
            color: #d1f7ff;
            border: 2px solid #ffb75e;
            padding: 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            outline: none;
            width: 100%;
            text-transform: uppercase;
        }

        .retro-input::placeholder {
            color: #4f6475;
            text-transform: none;
        }

        .retro-modal-btn {
            background: #ff6b6b;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 12px;
            border: 2px solid #8b0000;
            box-shadow: 2px 2px 0px #0b1329;
            cursor: pointer;
            text-align: center;
            margin-top: 4px;
        }

        .retro-modal-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #0b1329;
        }

        .btn-google {
            background: #4285F4;
            border-color: #0d47a1;
        }

        /* RESPONSIVIDADE ESPECIAL PARA MOBILE */
        @media (max-width: 768px) {
            body { align-items: flex-start; height: 100vh; height: 100dvh; }
            .device-frame { width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; border: none; box-shadow: none; padding: 6px; }
            .top-bar { margin-bottom: 6px; }
            .status-box { font-size: 8px; padding: 6px 8px; }
            .side-toolbar { left: 10px; top: 55px; }
            .side-btn { padding: 6px; font-size: 7px; }
            .retro-zoom-control { right: 8px; bottom: 120px; }
            .zoom-btn { width: 34px; height: 34px; font-size: 11px; }
            .spider-minimap { width: 95px; height: 95px; right: 10px; bottom: 10px; }
            .bottom-panel { gap: 4px; margin-top: 6px; }
            .avatar-section { gap: 4px; }
            .avatar-box-top { width: 36px; height: 36px; font-size: 14px; }
            .avatar-box-main { width: 42px; height: 52px; }
            .buttons-grid { gap: 4px; }
            .pill-btn { font-size: 5px; padding: 6px 5px; margin: 2px; box-shadow: 0px 2px black, 0px -2px black, 2px 0px black, -2px 0px black, 1px 1px black, -1px 1px black, 1px -1px black, -1px -1px black, 0px 4px #00000038, 2px 2px #00000038, -2px 2px #00000038, inset 0px 2px #ffffff36; }
            .pill-btn:active { transform: translateY(2px); box-shadow: 0px 2px black, 0px -2px black, 2px 0px black, -2px 0px black, 1px 1px black, -1px 1px black, 1px -1px black, -1px -1px black, inset 0px 2px #ffffff36; }
            .gps-status { font-size: 8px; top: 6px; right: 6px; }
        }
    </style>
</head>
<body>

    <!-- INTERFACE DE AUTENTICAÇÃO (LOGIN/CADASTRO) -->
    <div id="authScreen">
        <div class="retro-modal-box">
            <div class="retro-modal-title">ACESSO RESTRITO</div>
            <input type="email" id="emailInput" class="retro-input" placeholder="E-MAIL">
            <input type="password" id="passwordInput" class="retro-input" placeholder="SENHA">
            <button class="retro-modal-btn" onclick="loginEmail()">ENTRAR</button>
            <button class="retro-modal-btn" onclick="registerEmail()" style="background: #27ae60; border-color: #0b381e;">CADASTRAR NOVA CONTA</button>
            <div style="text-align: center; font-size: 10px; margin: 5px 0;">-- OU --</div>
            <button class="retro-modal-btn btn-google" onclick="loginGoogle()">ENTRAR COM GOOGLE</button>
        </div>
    </div>
    
    <!-- ESCOLHA DE NAMETAG -->
    <div id="nametagScreen">
        <div class="retro-modal-box">
            <div class="retro-modal-title">REGISTRO DE NAMETAG</div>
            <div class="retro-modal-content">Identificação pública obrigatória.</div>
            <input type="text" id="nametagInput" class="retro-input" placeholder="EX: HERO_99">
            <button class="retro-modal-btn" onclick="saveNametag()">CONFIRMAR</button>
        </div>
    </div>

    <!-- ABA DE PERFIL E ALIADOS -->
    <div id="profileScreen">
        <div class="retro-modal-box">
            <div class="retro-modal-title">PERFIL & ALIADOS</div>
            <div style="font-size:12px; margin-bottom: 10px; text-align: center;">Sua Nametag: <br><span id="myNametagDisplay" style="color:#ffb75e; font-size: 16px; font-weight: bold;"></span></div>
            
            <input type="text" id="friendNametagInput" class="retro-input" placeholder="NAMETAG DO ALIADO">
            <button class="retro-modal-btn" style="background: #27ae60; border-color: #0b381e;" onclick="addFriend()">ADICIONAR ALIADO</button>
            
            <div style="margin-top: 15px; border-top: 2px dashed #ffb75e; padding-top: 10px;">
                <div style="font-size:10px; margin-bottom:5px; color:#ffb75e;">ALIADOS CONECTADOS:</div>
                <div id="friendsList" style="max-height: 100px; overflow-y: auto; font-size: 10px;">
                    <!-- Lista injetada dinamicamente -->
                </div>
            </div>
            <button class="retro-modal-btn" style="background:#1b3a57; margin-top:10px;" onclick="closeProfile()">FECHAR TELA</button>
        </div>
    </div>

    <!-- INTERFACE PRINCIPAL -->
    <div class="device-frame">
        <!-- Barra Superior -->
        <div class="top-bar">
            <div class="icon-badge">🌐</div>
            <div class="status-box" id="statusMessage">SISTEMA BLOQUEADO - AGUARDANDO LOGIN</div>
            <div class="icon-badge">🕷️</div>
        </div>

        <!-- Menu Lateral Esquerdo -->
        <div class="side-toolbar">
            <button class="side-btn">0</button>
            <button class="side-btn">S</button>
            <button class="side-btn">T</button>
            <button class="side-btn btn-logout" onclick="logoutApp()" title="Sair da Conta">X</button>
        </div>

        <!-- Tela do Mapa Funcional (Leaflet) -->
        <div class="map-viewport">
            <div class="gps-status" id="gpsStatus">GPS: Aguardando...</div>
            <div id="leafletMap"></div>

            <!-- Controles de Zoom Personalizados Retrô -->
            <div class="retro-zoom-control">
                <button class="zoom-btn" onclick="zoomIn()">+</button>
                <button class="zoom-btn" onclick="zoomOut()">-</button>
            </div>

            <!-- Mini-mapa Teia de Aranha -->
            <div class="spider-minimap" id="spiderMinimap" onclick="centerOnMe()" title="Radar Teia de Aranha">
                <svg class="spider-web-svg" viewBox="0 0 100 100">
                    <line x1="50" y1="50" x2="50" y2="0" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="50" y2="100" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="0" y2="50" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="100" y2="50" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="15" y2="15" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="85" y2="85" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="15" y2="85" stroke="#1b3a57" stroke-width="0.8"/>
                    <line x1="50" y1="50" x2="85" y2="15" stroke="#1b3a57" stroke-width="0.8"/>
                    <polygon points="50,40 58,42 60,50 58,58 50,60 42,58 40,50 42,42" fill="none" stroke="#1b3a57" stroke-width="0.8"/>
                    <polygon points="50,28 68,32 72,50 68,68 50,72 32,68 28,50 32,32" fill="none" stroke="#1b3a57" stroke-width="0.8"/>
                    <polygon points="50,15 78,22 85,50 78,78 50,85 22,78 15,50 22,22" fill="none" stroke="#1b3a57" stroke-width="0.8"/>
                    <polygon points="50,2 90,10 98,50 90,90 50,98 10,90 2,50 10,10" fill="none" stroke="#21486c" stroke-width="1.2"/>
                </svg>
                <!-- Marcadores dinâmicos no radar -->
                <div class="spider-dot self-dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
            </div>
        </div>

        <!-- Painel Inferior com Avatares à Esquerda e Botões à Direita -->
        <div class="bottom-panel">
            <div class="avatar-section">
                <div class="avatar-box-top">🍅</div>
                <div class="avatar-box-main">🦸‍♂️</div>
            </div>

            <div class="buttons-grid">
                <!-- Linha 1 -->
                <button class="pill-btn pill-green-dark" onclick="setAlias('A.1')">A.1</button>
                <button class="pill-btn pill-green" onclick="setProf(1)">PROF 1</button>
                <button class="pill-btn pill-orange" onclick="setTerrainMode()">TERRAIN</button>
                <button class="pill-btn pill-orange" onclick="openChat()">CHAT</button>
                <!-- Linha 2 -->
                <button class="pill-btn pill-red" onclick="setAlias('A.2')">A.2</button>
                <button class="pill-btn pill-green" onclick="setProf(2)">PROF 2</button>
                <button class="pill-btn pill-disabled" onclick="toggleView3D()">3D VIEW</button>
                <button class="pill-btn pill-orange" onclick="openArchive()">ARCHIVE</button>
                <!-- Linha 3 -->
                <button class="pill-btn pill-green" onclick="openProfile()">PERFIL</button>
                <button class="pill-btn pill-green" onclick="setProf(3)">PROF 3</button>
                <button class="pill-btn pill-orange" onclick="centerOnMe()">CENTER LOC.</button>
                <button class="pill-btn pill-orange" onclick="shareLocation()">SHARE</button>
            </div>
        </div>
    </div>

    <!-- Modal de Notificação Retrô integrado à interface -->
    <div id="retroNotificationModal">
        <div class="retro-modal-box">
            <div class="retro-modal-title">TERMINAL NOTIFICAÇÃO</div>
            <div class="retro-modal-content" id="retroModalText">Mensagem do sistema</div>
            <button class="retro-modal-btn" onclick="closeRetroModal()">OK</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Firebase SDKs e Lógica do Mapa Funcional -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ==========================================
        // CONFIGURAÇÃO DO FIREBASE FORNECIDA
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCvTRvsTKEBjYiKxIKqDcTfjRFM_tzxYgw",
            authDomain: "spider-track-6c9fd.firebaseapp.com",
            projectId: "spider-track-6c9fd",
            storageBucket: "spider-track-6c9fd.firebasestorage.app",
            messagingSenderId: "307541745117",
            appId: "1:307541745117:web:004ea4f66b35e6b2492a34"
        };

        let db, auth;
        let currentHeroUid = '';
        let currentHeroName = ''; // Passará a ser a Nametag
        let trackingStarted = false;
        let myFriendsList = []; // Lista de UIDs de aliados

        // Inicializa o Mapa Leaflet com coordenadas padrão
        const map = L.map('leafletMap', {
            zoomControl: false, attributionControl: false, tap: true, dragging: true, touchZoom: true, scrollWheelZoom: true
        }).setView([-23.55052, -46.633308], 14);

        window.zoomIn = () => map.zoomIn();
        window.zoomOut = () => map.zoomOut();

        const darkTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        let isTerrainActive = false;
        
        window.setTerrainMode = function() {
            isTerrainActive = !isTerrainActive;
            if (isTerrainActive) {
                map.removeLayer(darkTileLayer);
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
                showRetroModal("Modo Terrain (Satélite) ativado com sucesso!");
            } else {
                location.reload(); 
            }
        };

        const markersLayer = L.layerGroup().addTo(map);
        let myCurrentLatLng = null;
        let allUsersData = {};

        // INICIALIZAÇÃO FIREBASE E AUTENTICAÇÃO
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            auth = getAuth(app);
            const googleProvider = new GoogleAuthProvider();

            // Monitorar Status de Autenticação
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentHeroUid = user.uid;
                    // Verifica se o usuário já registrou uma Nametag
                    const userRef = ref(db, 'users/' + currentHeroUid);
                    get(userRef).then((snapshot) => {
                        if (snapshot.exists() && snapshot.val().nametag) {
                            currentHeroName = snapshot.val().nametag;
                            completeLoginProcess();
                        } else {
                            // Se não tem nametag, abre a tela de registro
                            document.getElementById('authScreen').style.display = 'none';
                            document.getElementById('nametagScreen').style.display = 'flex';
                        }
                    });
                } else {
                    // Usuário Deslogado
                    document.getElementById('authScreen').style.display = 'flex';
                    document.getElementById('nametagScreen').style.display = 'none';
                    document.getElementById('profileScreen').style.display = 'none';
                    document.getElementById('statusMessage').innerText = 'SISTEMA BLOQUEADO';
                    trackingStarted = false;
                    myFriendsList = [];
                }
            });

            // Funções de Registro e Nametag
            window.saveNametag = async () => {
                const nametag = document.getElementById('nametagInput').value.trim().toUpperCase();
                if(!nametag) return showRetroModal("Digite uma Nametag válida!");
                
                await set(ref(db, 'users/' + currentHeroUid), { nametag: nametag });
                currentHeroName = nametag;
                
                document.getElementById('nametagScreen').style.display = 'none';
                completeLoginProcess();
            };

            function completeLoginProcess() {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('statusMessage').innerText = `IDENTIDADE: ${currentHeroName}`;
                
                listenToMyFriends(); // Começa a escutar lista de aliados
                
                if (!trackingStarted) {
                    startRealtimeLocationTracking();
                    listenToAllUsersLocations();
                    trackingStarted = true;
                }
            }

            // Funções Globais de Autenticação
            window.loginEmail = () => {
                const email = document.getElementById('emailInput').value;
                const pass = document.getElementById('passwordInput').value;
                if(!email || !pass) return showRetroModal("Preencha e-mail e senha!");
                signInWithEmailAndPassword(auth, email, pass).catch(e => showRetroModal("Erro no login: " + e.message));
            };

            window.registerEmail = () => {
                const email = document.getElementById('emailInput').value;
                const pass = document.getElementById('passwordInput').value;
                if(!email || !pass) return showRetroModal("Preencha e-mail e senha para cadastro!");
                createUserWithEmailAndPassword(auth, email, pass)
                    .then(() => showRetroModal("Conta criada! Conclua com sua Nametag."))
                    .catch(e => showRetroModal("Erro no cadastro: " + e.message));
            };

            window.loginGoogle = () => {
                signInWithPopup(auth, googleProvider).catch(e => showRetroModal("Erro no Google: " + e.message));
            };

            window.logoutApp = () => {
                signOut(auth).then(() => {
                    showRetroModal("Desconectado do sistema com sucesso.");
                    setTimeout(() => location.reload(), 1500);
                });
            };

            // SISTEMA DE ALIADOS / PERFIL
            window.openProfile = () => {
                document.getElementById('myNametagDisplay').innerText = currentHeroName;
                document.getElementById('profileScreen').style.display = 'flex';
            };

            window.closeProfile = () => {
                document.getElementById('profileScreen').style.display = 'none';
            };

            window.addFriend = async () => {
                const friendNametag = document.getElementById('friendNametagInput').value.trim().toUpperCase();
                if(!friendNametag) return showRetroModal("Digite a Nametag do aliado!");
                if(friendNametag === currentHeroName) return showRetroModal("Você não pode adicionar a si mesmo!");

                const usersRef = ref(db, 'users');
                get(usersRef).then(snapshot => {
                    if(snapshot.exists()) {
                        const users = snapshot.val();
                        let foundUid = null;
                        
                        // Busca o UID correspondente a Nametag
                        for(let uid in users) {
                            if(users[uid].nametag && users[uid].nametag.toUpperCase() === friendNametag) {
                                foundUid = uid;
                                break;
                            }
                        }
                        
                        if(foundUid) {
                            // Adição Mútua para que ambos se vejam no mapa automaticamente
                            Promise.all([
                                set(ref(db, 'users/' + currentHeroUid + '/friends/' + foundUid), friendNametag),
                                set(ref(db, 'users/' + foundUid + '/friends/' + currentHeroUid), currentHeroName)
                            ]).then(() => {
                                showRetroModal(`Conexão mútua estabelecida com ${friendNametag}! Vocês já podem se ver no mapa.`);
                                document.getElementById('friendNametagInput').value = '';
                            });
                        } else {
                            showRetroModal("Nametag não encontrada nos registros!");
                        }
                    }
                });
            };

            function listenToMyFriends() {
                onValue(ref(db, 'users/' + currentHeroUid + '/friends'), (snapshot) => {
                    myFriendsList = [];
                    const listDiv = document.getElementById('friendsList');
                    listDiv.innerHTML = '';
                    
                    if (snapshot.exists()) {
                        const friendsData = snapshot.val();
                        Object.keys(friendsData).forEach(fUid => {
                            myFriendsList.push(fUid);
                            listDiv.innerHTML += `<div style="padding: 6px; border-bottom: 1px solid #1b3a57;">• ${friendsData[fUid]}</div>`;
                        });
                    } else {
                        listDiv.innerHTML = '<div style="padding: 6px; color: #4f6475;">Nenhum aliado conectado.</div>';
                    }
                    
                    // Atualiza o mapa se ele já estiver rodando
                    if (trackingStarted) listenToAllUsersLocations();
                });
            }

        } catch (e) {
            console.warn("Erro ao configurar Firebase. Executando em modo de simulação local.");
            document.getElementById('authScreen').style.display = 'none';
            currentHeroUid = 'heroi_' + Math.random().toString(36).substring(2, 9);
            currentHeroName = 'SIMULAÇÃO-' + Math.floor(Math.random() * 900 + 100);
            document.getElementById('statusMessage').innerText = `SIMULAÇÃO: ${currentHeroName}`;
            
            // Funções fake para modo simulação não quebrar
            window.openProfile = () => showRetroModal("O sistema de perfil está indisponível na simulação local.");
            myFriendsList = ['mock_vigilante']; 

            startRealtimeLocationTracking();
            listenToAllUsersLocations();
        }

        // FUNÇÕES DE RASTREAMENTO E MAPA
        function startRealtimeLocationTracking() {
            const gpsStatus = document.getElementById('gpsStatus');
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        myCurrentLatLng = [lat, lng];
                        gpsStatus.innerText = `GPS: ATIVO`;

                        if (db) {
                            set(ref(db, 'locations/' + currentHeroUid), {
                                name: currentHeroName, latitude: lat, longitude: lng, timestamp: Date.now()
                            });
                        } else {
                            updateLocalMarkerSimulation(currentHeroUid, currentHeroName, lat, lng);
                        }
                    },
                    (error) => {
                        gpsStatus.innerText = "GPS: ERRO";
                        myCurrentLatLng = [-23.55052, -46.633308];
                        if(!db) updateLocalMarkerSimulation(currentHeroUid, currentHeroName, -23.55052, -46.633308);
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }
        }

        function listenToAllUsersLocations() {
            if (!db) return;
            const locationsRef = ref(db, 'locations/');
            onValue(locationsRef, (snapshot) => {
                const data = snapshot.val();
                markersLayer.clearLayers();
                allUsersData = {};

                if (data) {
                    Object.keys(data).forEach(uid => {
                        const user = data[uid];
                        
                        // FILTRO: Apenas renderiza no mapa você mesmo e os usuários que estão na sua lista de amigos
                        if(uid === currentHeroUid || myFriendsList.includes(uid)) {
                            allUsersData[uid] = user;
                            renderMarker(uid, user.name, user.latitude, user.longitude, uid === currentHeroUid);
                        }
                    });
                    updateSpiderMinimap();
                }
            });
        }

        function renderMarker(uid, name, lat, lng, isSelf) {
            const iconHtml = `
                <div class="marker-pin ${isSelf ? 'self' : ''}">
                    ${isSelf ? '⭐' : '📍'}
                    <div class="marker-label">${name}</div>
                </div>
            `;
            const customIcon = L.divIcon({ className: 'custom-retro-marker', html: iconHtml, iconSize: [24, 24], iconAnchor: [12, 12] });
            const marker = L.marker([lat, lng], { icon: customIcon });
            markersLayer.addLayer(marker);

            if (isSelf && !window.hasCenteredInitial) {
                map.setView([lat, lng], 15);
                window.hasCenteredInitial = true;
            }
        }

        // SIMULADOR LOCAL
        const simulatedUsers = {};
        function updateLocalMarkerSimulation(uid, name, lat, lng) {
            simulatedUsers[uid] = { name, latitude: lat, longitude: lng };
            allUsersData = { ...simulatedUsers };
            markersLayer.clearLayers();

            renderMarker('mock_vigilante', 'Vigilante-X', lat + 0.005, lng + 0.005, false);
            allUsersData['mock_vigilante'] = { name: 'Vigilante-X', latitude: lat + 0.005, longitude: lng + 0.005 };

            Object.keys(simulatedUsers).forEach(id => {
                const u = simulatedUsers[id];
                renderMarker(id, u.name, u.latitude, u.longitude, id === currentHeroUid);
            });
            updateSpiderMinimap();
        }

        function updateSpiderMinimap() {
            const minimap = document.getElementById('spiderMinimap');
            const existingDots = minimap.querySelectorAll('.spider-dot:not(.self-dot)');
            existingDots.forEach(d => d.remove());

            if (!myCurrentLatLng) return;

            const [myLat, myLng] = myCurrentLatLng;
            const scaleFactor = 3500;

            Object.keys(allUsersData).forEach(uid => {
                if (uid === currentHeroUid) return;
                const user = allUsersData[uid];
                
                let posX = 50 + ((user.longitude - myLng) * scaleFactor);
                let posY = 50 - ((user.latitude - myLat) * scaleFactor);

                posX = Math.max(8, Math.min(92, posX));
                posY = Math.max(8, Math.min(92, posY));

                const dot = document.createElement('div');
                dot.className = 'spider-dot';
                dot.style.left = `${posX}%`;
                dot.style.top = `${posY}%`;
                dot.title = user.name;
                minimap.appendChild(dot);
            });
        }

        window.centerOnMe = function() {
            if (myCurrentLatLng) {
                map.setView(myCurrentLatLng, 16, { animate: true });
                showRetroModal("Centralizando na sua localização exata.");
            } else {
                showRetroModal("Aguardando sinal do GPS...");
            }
        };
    </script>

    <!-- Funções Auxiliares de Interface -->
    <script>
        function showRetroModal(message) {
            document.getElementById('retroModalText').innerText = message;
            document.getElementById('retroNotificationModal').style.display = 'flex';
        }

        function closeRetroModal() {
            document.getElementById('retroNotificationModal').style.display = 'none';
        }

        function setAlias(alias) { showRetroModal(`Alias corporativo alterado para: ${alias}`); }
        function setProf(profNum) { 
            let profileNames = { 1: "Operacional Tático", 2: "Furtivo / Invisível", 3: "Busca de Resgate" };
            showRetroModal(`Perfil de Rastreamento ${profNum} (${profileNames[profNum] || 'Padrão'}) ativado!`); 
        }
        function toggleView3D() { showRetroModal("Visualização 3D desativada no momento."); }
        function openChat() { showRetroModal("Canal de chat seguro aberto com a central de heróis."); }
        function openArchive() { showRetroModal("Arquivos confidenciais de missões abertos."); }
        
        function shareLocation() { 
            if (navigator.clipboard && window.location.href) {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    showRetroModal("Link de rastreamento copiado para a área de transferência!");
                }).catch(() => showRetroModal("Link gerado: " + window.location.href));
            } else {
                showRetroModal("Link gerado com sucesso para compartilhamento.");
            }
        }
    </script>
</body>
</html>
