<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Tracker - Interface Retrô</title>
    <!-- Importando fonte pixelada e fontes padrão -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Leaflet CSS para o mapa funcional -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            background-color: #0b1329;
            color: #d1f7ff;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* Container principal simulando o dispositivo/tela */
        .device-frame {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 900px;
            max-height: 900px;
            background: #4a90e2;
            border: 8px solid #213865;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 12px;
        }

        /* Cabeçalho do Monitor */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 10;
        }

        .status-box {
            background: #ffb75e;
            color: #331a00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 8px 12px;
            border: 3px solid #7c3f00;
            box-shadow: 3px 3px 0px #213865;
            text-align: center;
            flex-grow: 1;
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-badge {
            background: #ffb75e;
            border: 3px solid #7c3f00;
            padding: 6px;
            box-shadow: 3px 3px 0px #213865;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* Área do Mapa Funcional */
        .map-viewport {
            flex-grow: 1;
            background: #0d1b2a;
            border: 4px solid #1b3a57;
            position: relative;
            overflow: hidden;
            touch-action: pan-x pan-y pinch-zoom;
        }

        #leafletMap {
            width: 100%;
            height: 100%;
            background: #0b192c;
            z-index: 1;
        }

        .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(1.5) hue-rotate(180deg) saturate(0.8) !important;
        }

        .custom-retro-marker {
            background: transparent;
            border: none;
        }

        .marker-pin {
            width: 24px;
            height: 24px;
            background: #ff4757;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff4757;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .marker-pin.self {
            background: #2ed573;
            box-shadow: 0 0 15px #2ed573;
        }

        .marker-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #d1f7ff;
            font-size: 8px;
            padding: 2px 4px;
            white-space: nowrap;
            border: 1px solid #1b3a57;
            border-radius: 2px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Barra Lateral de Comandos (Esquerda) */
        .side-toolbar {
            position: absolute;
            left: 18px;
            top: 70px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
        }

        .side-btn {
            background: #ff6b6b;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 8px;
            border: 2px solid #8b0000;
            box-shadow: 2px 2px 0px #213865;
            cursor: pointer;
            text-align: center;
        }

        /* Controles de Zoom Estilizados Retrô */
        .retro-zoom-control {
            position: absolute;
            right: 12px;
            bottom: 130px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
        }

        .zoom-btn {
            background: #ffdfba;
            color: #4a2e00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            width: 32px;
            height: 32px;
            border: 3px solid #8c5821;
            box-shadow: 2px 2px 0px #213865;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #213865;
        }

        /* Painel de Controle Inferior */
        .bottom-panel {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        /* Bloco dos Avatares à Esquerda */
        .avatar-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
            padding-left: 4px;
        }

        .avatar-box-top {
            width: 44px;
            height: 44px;
            background: #ff6b4a;
            border: 3px solid #8b2500;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px #1c355e;
            font-size: 18px;
        }

        .avatar-box-main {
            width: 52px;
            height: 64px;
            background: #ff7657;
            border: 3px solid #8b2500;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px #1c355e;
            position: relative;
        }

        /* Grade de Botões */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, auto);
            gap: 6px;
            justify-content: flex-end;
            flex-grow: 1;
        }

        /* ========================================================
           ESTILO DE PIXEL COM CANTOS ARREDONDADOS/PIXEL SOZINHO NOS CANTOS
           ======================================================== */
        .pill-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 8px 10px;
            margin: 3px;
            shape-rendering: crispEdges;
            border: 0;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            letter-spacing: -0.5px;
            box-shadow:
                /* Eixo Y estrito e eixo X estrito */
                0px 3px black,
                0px -3px black,
                3px 0px black,
                -3px 0px black,
                /* Pixel isolado nos cantos diagonais (entre eixo X e Y) */
                1px 2px black,
                -1px 2px black,
                1px -2px black,
                -1px -2px black,
                2px 1px black,
                -2px 1px black,
                2px -1px black,
                -2px -1px black,
                /* Sombra externa suave retrô */
                0px 6px #00000038,
                3px 3px #00000038,
                -3px 3px #00000038,
                /* Brilho interno */
                inset 0px 3px #ffffff36;
        }

        .pill-btn:active {
            transform: translateY(3px);
            box-shadow:
                0px 3px black,
                0px -3px black,
                3px 0px black,
                -3px 0px black,
                1px 2px black,
                -1px 2px black,
                1px -2px black,
                -1px -2px black,
                2px 1px black,
                -2px 1px black,
                2px -1px black,
                -2px -1px black,
                inset 0px 3px #00000038;
        }

        /* Cores aplicadas ao estilo Pixel */
        .pill-green-dark {
            --color: #ffffff;
            --bg-color: #27ae60;
            color: var(--color);
            background-color: var(--bg-color);
        }

        .pill-green {
            --color: #0b381e;
            --bg-color: #2ecc71;
            color: var(--color);
            background-color: var(--bg-color);
        }

        .pill-red {
            --color: #ffffff;
            --bg-color: #e74c3c;
            color: var(--color);
            background-color: var(--bg-color);
        }

        .pill-outline {
            --color: transparent;
            --bg-color: transparent;
            color: var(--color);
            background-color: var(--bg-color);
            box-shadow: none !important;
            cursor: default;
            border: 0 !important;
        }
        .pill-outline:active {
            transform: none !important;
            box-shadow: none !important;
        }

        .pill-orange {
            --color: #3b2300;
            --bg-color: #f39c12;
            color: var(--color);
            background-color: var(--bg-color);
        }

        .pill-disabled {
            --color: #b0bec5;
            --bg-color: #4f6475;
            color: var(--color);
            background-color: var(--bg-color);
            cursor: not-allowed;
            box-shadow:
                0px 3px #1a2327,
                0px -3px #1a2327,
                3px 0px #1a2327,
                -3px 0px #1a2327,
                1px 2px #1a2327,
                -1px 2px #1a2327,
                1px -2px #1a2327,
                -1px -2px #1a2327,
                2px 1px #1a2327,
                -2px 1px #1a2327,
                2px -1px #1a2327,
                -2px -1px #1a2327;
        }
        .pill-disabled:active {
            transform: none;
            box-shadow:
                0px 3px #1a2327,
                0px -3px #1a2327,
                3px 0px #1a2327,
                -3px 0px #1a2327,
                1px 2px #1a2327,
                -1px 2px #1a2327,
                1px -2px #1a2327,
                -1px -2px #1a2327,
                2px 1px #1a2327,
                -2px 1px #1a2327,
                2px -1px #1a2327,
                -2px -1px #1a2327;
        }

        /* Mensagens de status do GPS */
        .gps-status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 10px;
            background: rgba(0,0,0,0.75);
            color: #d1f7ff;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #1b3a57;
            z-index: 1000;
        }

        /* RESPONSIVIDADE ESPECIAL PARA MOBILE */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                height: 100vh;
                height: 100dvh;
            }

            .device-frame {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                max-width: none;
                max-height: none;
                border: none;
                box-shadow: none;
                padding: 6px;
            }

            .top-bar {
                margin-bottom: 6px;
            }

            .status-box {
                font-size: 8px;
                padding: 6px 8px;
            }

            .side-toolbar {
                left: 10px;
                top: 55px;
            }

            .side-btn {
                padding: 6px;
                font-size: 7px;
            }

            .retro-zoom-control {
                right: 8px;
                bottom: 120px;
            }

            .zoom-btn {
                width: 34px;
                height: 34px;
                font-size: 11px;
            }

            .bottom-panel {
                gap: 4px;
                margin-top: 6px;
            }

            .avatar-section {
                gap: 4px;
            }

            .avatar-box-top {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .avatar-box-main {
                width: 42px;
                height: 52px;
            }

            .buttons-grid {
                gap: 4px;
            }

            .pill-btn {
                font-size: 5px;
                padding: 6px 5px;
                margin: 2px;
                box-shadow:
                    0px 2px black,
                    0px -2px black,
                    2px 0px black,
                    -2px 0px black,
                    1px 1px black,
                    -1px 1px black,
                    1px -1px black,
                    -1px -1px black,
                    0px 4px #00000038,
                    2px 2px #00000038,
                    -2px 2px #00000038,
                    inset 0px 2px #ffffff36;
            }

            .pill-btn:active {
                transform: translateY(2px);
                box-shadow:
                    0px 2px black,
                    0px -2px black,
                    2px 0px black,
                    -2px 0px black,
                    1px 1px black,
                    -1px 1px black,
                    1px -1px black,
                    -1px -1px black,
                    inset 0px 2px #ffffff36;
            }

            .gps-status {
                font-size: 8px;
                top: 6px;
                right: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- INTERFACE PRINCIPAL -->
    <div class="device-frame">
        <!-- Barra Superior -->
        <div class="top-bar">
            <div class="icon-badge">🌐</div>
            <div class="status-box" id="statusMessage">SISTEMA ATIVO - RASTREAMENTO DIRETO</div>
            <div class="icon-badge">🕷️</div>
        </div>

        <!-- Menu Lateral Esquerdo -->
        <div class="side-toolbar">
            <button class="side-btn">0</button>
            <button class="side-btn">S</button>
            <button class="side-btn">T</button>
        </div>

        <!-- Tela do Mapa Funcional (Leaflet) -->
        <div class="map-viewport">
            <div class="gps-status" id="gpsStatus">GPS: Buscando sinal...</div>
            <div id="leafletMap"></div>

            <!-- Controles de Zoom Personalizados Retrô -->
            <div class="retro-zoom-control">
                <button class="zoom-btn" onclick="zoomIn()">+</button>
                <button class="zoom-btn" onclick="zoomOut()">-</button>
            </div>
        </div>

        <!-- Painel Inferior com Avatares à Esquerda e Botões à Direita -->
        <div class="bottom-panel">
            <!-- Avatares à Esquerda -->
            <div class="avatar-section">
                <div class="avatar-box-top">🍅</div>
                <div class="avatar-box-main">🦸‍♂️</div>
            </div>

            <!-- Grade de Botões à Direita -->
            <div class="buttons-grid">
                <!-- Linha 1 -->
                <button class="pill-btn pill-green-dark" onclick="setAlias('A.1')">A.1</button>
                <button class="pill-btn pill-green" onclick="setProf(1)">PROF 1</button>
                <button class="pill-btn pill-orange" onclick="setTerrainMode()">TERRAIN</button>
                <button class="pill-btn pill-orange" onclick="openChat()">CHAT</button>

                <!-- Linha 2 -->
                <button class="pill-btn pill-red" onclick="setAlias('A.2')">A.2</button>
                <button class="pill-btn pill-green" onclick="setProf(2)">PROF 2</button>
                <button class="pill-btn pill-disabled" onclick="toggleView3D()">3D VIEW</button>
                <button class="pill-btn pill-orange" onclick="openArchive()">ARCHIVE</button>

                <!-- Linha 3 -->
                <button class="pill-btn pill-outline"></button>
                <button class="pill-btn pill-green" onclick="setProf(3)">PROF 3</button>
                <button class="pill-btn pill-orange" onclick="centerOnMe()">CENTER LOC.</button>
                <button class="pill-btn pill-orange" onclick="shareLocation()">SHARE</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Firebase SDKs e Lógica do Mapa Funcional -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // CONFIGURAÇÃO DO FIREBASE (INSIRA SEUS DADOS)
        // ==========================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "SEU_AUTH_DOMAIN_AQUI",
            databaseURL: "SEU_DATABASE_URL_AQUI",
            projectId: "SEU_PROJECT_ID_AQUI",
            storageBucket: "SEU_STORAGE_BUCKET_AQUI",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.warn("Firebase não configurado. Executando em modo de simulação local.");
        }

        const currentHeroUid = 'heroi_' + Math.random().toString(36).substring(2, 9);
        const currentHeroName = 'Herói-' + Math.floor(Math.random() * 900 + 100);

        document.getElementById('statusMessage').innerText = `IDENTIDADE: ${currentHeroName.toUpperCase()}`;

        // Inicializa o Mapa Leaflet com coordenadas padrão otimizadas para toque mobile
        const map = L.map('leafletMap', {
            zoomControl: false,
            attributionControl: false,
            tap: true,
            dragging: true,
            touchZoom: true,
            scrollWheelZoom: true
        }).setView([-23.55052, -46.633308], 14);

        // Funções de Zoom globais para os botões estilizados
        window.zoomIn = function() {
            map.zoomIn();
        }
        window.zoomOut = function() {
            map.zoomOut();
        }

        // Adiciona a camada de mapa base (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        const markersLayer = L.layerGroup().addTo(map);
        let myCurrentLatLng = null;

        startRealtimeLocationTracking();
        listenToAllUsersLocations();

        function startRealtimeLocationTracking() {
            const gpsStatus = document.getElementById('gpsStatus');
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        myCurrentLatLng = [lat, lng];
                        gpsStatus.innerText = `GPS: ATIVO`;

                        if (db) {
                            set(ref(db, 'locations/' + currentHeroUid), {
                                name: currentHeroName,
                                latitude: lat,
                                longitude: lng,
                                timestamp: Date.now()
                            });
                        } else {
                            updateLocalMarkerSimulation(currentHeroUid, currentHeroName, lat, lng);
                        }
                    },
                    (error) => {
                        gpsStatus.innerText = "GPS: ERRO";
                        console.error(error);
                        myCurrentLatLng = [-23.55052, -46.633308];
                        updateLocalMarkerSimulation(currentHeroUid, currentHeroName, -23.55052, -46.633308);
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                gpsStatus.innerText = "GPS: INDISPONÍVEL";
                myCurrentLatLng = [-23.55052, -46.633308];
                updateLocalMarkerSimulation(currentHeroUid, currentHeroName, -23.55052, -46.633308);
            }
        }

        function listenToAllUsersLocations() {
            if (!db) return;
            const locationsRef = ref(db, 'locations/');
            onValue(locationsRef, (snapshot) => {
                const data = snapshot.val();
                markersLayer.clearLayers();

                if (data) {
                    Object.keys(data).forEach(uid => {
                        const user = data[uid];
                        renderMarker(uid, user.name, user.latitude, user.longitude, uid === currentHeroUid);
                    });
                }
            });
        }

        function renderMarker(uid, name, lat, lng, isSelf) {
            const iconHtml = `
                <div class="marker-pin ${isSelf ? 'self' : ''}">
                    ${isSelf ? '⭐' : '📍'}
                    <div class="marker-label">${name}</div>
                </div>
            `;

            const customIcon = L.divIcon({
                className: 'custom-retro-marker',
                html: iconHtml,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            const marker = L.marker([lat, lng], { icon: customIcon });
            markersLayer.addLayer(marker);

            if (isSelf && !window.hasCenteredInitial) {
                map.setView([lat, lng], 15);
                window.hasCenteredInitial = true;
            }
        }

        const simulatedUsers = {};
        function updateLocalMarkerSimulation(uid, name, lat, lng) {
            simulatedUsers[uid] = { name, latitude: lat, longitude: lng };
            markersLayer.clearLayers();

            renderMarker('mock_vigilante', 'Vigilante-X', lat + 0.005, lng + 0.005, false);

            Object.keys(simulatedUsers).forEach(id => {
                const u = simulatedUsers[id];
                renderMarker(id, u.name, u.latitude, u.longitude, id === currentHeroUid);
            });
        }

        window.centerOnMe = function() {
            if (myCurrentLatLng) {
                map.setView(myCurrentLatLng, 16, { animate: true });
                alert("Centralizando na sua localização exata.");
            } else {
                alert("Aguardando sinal do GPS...");
            }
        };
    </script>

    <!-- Funções dos Botões -->
    <script>
        function setAlias(alias) { alert(`Alias ${alias} selecionado!`); }
        function setProf(profNum) { alert(`Perfil ${profNum} selecionado!`); }
        function setTerrainMode() { alert("Modo de Terreno ativado!"); }
        function toggleView3D() { alert("Visualização 3D desativada no momento."); }
        function openChat() { alert("Canal de chat aberto."); }
        function openArchive() { alert("Arquivos abertos."); }
        function shareLocation() { alert("Link copiado para compartilhamento!"); }
    </script>
</body>
</html>
