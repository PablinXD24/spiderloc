<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hero Tracker - Interface Retrô</title>
    <!-- Importando fonte pixelada e fontes padrão -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Leaflet CSS para o mapa funcional -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #0b1329;
            color: #d1f7ff;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container principal simulando o dispositivo/tela */
        .device-frame {
            width: 100vw;
            height: 100vh;
            max-width: 900px;
            max-height: 900px;
            background: #4a90e2;
            border: 8px solid #213865;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 12px;
        }

        /* Cabeçalho do Monitor */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 10;
        }

        .status-box {
            background: #ffb75e;
            color: #331a00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 8px 12px;
            border: 3px solid #7c3f00;
            box-shadow: 3px 3px 0px #213865;
            text-align: center;
            flex-grow: 1;
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-badge {
            background: #ffb75e;
            border: 3px solid #7c3f00;
            padding: 6px;
            box-shadow: 3px 3px 0px #213865;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* Área do Mapa Funcional */
        .map-viewport {
            flex-grow: 1;
            background: #0d1b2a;
            border: 4px solid #1b3a57;
            position: relative;
            overflow: hidden;
        }

        /* Elemento onde o mapa Leaflet será renderizado */
        #leafletMap {
            width: 100%;
            height: 100%;
            background: #0b192c;
            z-index: 1;
        }

        /* Filtro tático/retrô aplicado sobre o mapa real para manter a estética do projeto */
        .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(1.5) hue-rotate(180deg) saturate(0.8) !important;
        }

        /* Estilização personalizada dos Marcadores no mapa */
        .custom-retro-marker {
            background: transparent;
            border: none;
        }

        .marker-pin {
            width: 24px;
            height: 24px;
            background: #ff4757;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff4757;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .marker-pin.self {
            background: #2ed573;
            box-shadow: 0 0 15px #2ed573;
        }

        .marker-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #d1f7ff;
            font-size: 8px;
            padding: 2px 4px;
            white-space: nowrap;
            border: 1px solid #1b3a57;
            border-radius: 2px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Barra Lateral de Comandos (Esquerda) */
        .side-toolbar {
            position: absolute;
            left: 18px;
            top: 70px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1000;
        }

        .side-btn {
            background: #ff6b6b;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 8px;
            border: 2px solid #8b0000;
            box-shadow: 2px 2px 0px #213865;
            cursor: pointer;
            text-align: center;
        }

        /* Painel de Controle Inferior */
        .bottom-panel {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .retro-btn {
            background: #ffdfba;
            color: #4a2e00;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 10px 4px;
            border: 3px solid #8c5821;
            box-shadow: 3px 3px 0px #213865;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s;
        }

        .retro-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #213865;
        }

        /* Mensagens de status do GPS */
        .gps-status {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 10px;
            background: rgba(0,0,0,0.75);
            color: #d1f7ff;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #1b3a57;
            z-index: 1000;
        }

        /* RESPONSIVIDADE ESPECIAL PARA MOBILE */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                height: 100vh;
                height: 100dvh;
            }

            .device-frame {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                max-width: none;
                max-height: none;
                border: none;
                box-shadow: none;
                padding: 6px;
            }

            .top-bar {
                margin-bottom: 6px;
            }

            .status-box {
                font-size: 8px;
                padding: 6px 8px;
            }

            .side-toolbar {
                left: 10px;
                top: 55px;
            }

            .side-btn {
                padding: 6px;
                font-size: 7px;
            }

            .bottom-panel {
                grid-template-columns: repeat(4, 1fr);
                gap: 5px;
                margin-top: 6px;
            }

            .retro-btn {
                font-size: 7px;
                padding: 8px 2px;
                border-width: 2px;
                box-shadow: 2px 2px 0px #213865;
            }

            .gps-status {
                font-size: 8px;
                top: 6px;
                right: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- INTERFACE PRINCIPAL -->
    <div class="device-frame">
        <!-- Barra Superior -->
        <div class="top-bar">
            <div class="icon-badge">🌐</div>
            <div class="status-box" id="statusMessage">SISTEMA ATIVO - RASTREAMENTO DIRETO</div>
            <div class="icon-badge">🕷️</div>
        </div>

        <!-- Menu Lateral Esquerdo -->
        <div class="side-toolbar">
            <button class="side-btn">0</button>
            <button class="side-btn">S</button>
            <button class="side-btn">T</button>
        </div>

        <!-- Tela do Mapa Funcional (Leaflet) -->
        <div class="map-viewport">
            <div class="gps-status" id="gpsStatus">GPS: Buscando sinal...</div>
            <div id="leafletMap"></div>
        </div>

        <!-- Painel de Controle Inferior -->
        <div class="bottom-panel">
            <button class="retro-btn" onclick="setTerrainMode()">TERRAIN</button>
            <button class="retro-btn" onclick="toggleView3D()">3D VIEW</button>
            <button class="retro-btn" onclick="centerOnMe()">CENTER LOC</button>
            <button class="retro-btn" onclick="openChat()">CHAT</button>
            <button class="retro-btn">PROF 1</button>
            <button class="retro-btn">PROF 2</button>
            <button class="retro-btn" onclick="openArchive()">ARCHIVE</button>
            <button class="retro-btn" onclick="shareLocation()">SHARE</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Firebase SDKs e Lógica do Mapa Funcional -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // CONFIGURAÇÃO DO FIREBASE (INSIRA SEUS DADOS)
        // ==========================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "SEU_AUTH_DOMAIN_AQUI",
            databaseURL: "SEU_DATABASE_URL_AQUI",
            projectId: "SEU_PROJECT_ID_AQUI",
            storageBucket: "SEU_STORAGE_BUCKET_AQUI",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.warn("Firebase não configurado. Executando em modo de simulação local.");
        }

        const currentHeroUid = 'heroi_' + Math.random().toString(36).substring(2, 9);
        const currentHeroName = 'Herói-' + Math.floor(Math.random() * 900 + 100);

        document.getElementById('statusMessage').innerText = `IDENTIDADE: ${currentHeroName.toUpperCase()}`;

        // Inicializa o Mapa Leaflet com coordenadas padrão (ex: São Paulo) centralizadas
        const map = L.map('leafletMap', {
            zoomControl: false,
            attributionControl: false
        }).setView([-23.55052, -46.633308], 14);

        // Adiciona a camada de mapa base (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        const markersLayer = L.layerGroup().addTo(map);
        let myCurrentLatLng = null;

        startRealtimeLocationTracking();
        listenToAllUsersLocations();

        function startRealtimeLocationTracking() {
            const gpsStatus = document.getElementById('gpsStatus');
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        myCurrentLatLng = [lat, lng];
                        gpsStatus.innerText = `GPS: ATIVO`;

                        if (db) {
                            set(ref(db, 'locations/' + currentHeroUid), {
                                name: currentHeroName,
                                latitude: lat,
                                longitude: lng,
                                timestamp: Date.now()
                            });
                        } else {
                            updateLocalMarkerSimulation(currentHeroUid, currentHeroName, lat, lng);
                        }
                    },
                    (error) => {
                        gpsStatus.innerText = "GPS: ERRO";
                        console.error(error);
                        // Fallback de simulação caso o GPS seja negado
                        myCurrentLatLng = [-23.55052, -46.633308];
                        updateLocalMarkerSimulation(currentHeroUid, currentHeroName, -23.55052, -46.633308);
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                gpsStatus.innerText = "GPS: INDISPONÍVEL";
                myCurrentLatLng = [-23.55052, -46.633308];
                updateLocalMarkerSimulation(currentHeroUid, currentHeroName, -23.55052, -46.633308);
            }
        }

        function listenToAllUsersLocations() {
            if (!db) return;
            const locationsRef = ref(db, 'locations/');
            onValue(locationsRef, (snapshot) => {
                const data = snapshot.val();
                markersLayer.clearLayers();

                if (data) {
                    Object.keys(data).forEach(uid => {
                        const user = data[uid];
                        renderMarker(uid, user.name, user.latitude, user.longitude, uid === currentHeroUid);
                    });
                }
            });
        }

        function renderMarker(uid, name, lat, lng, isSelf) {
            const iconHtml = `
                <div class="marker-pin ${isSelf ? 'self' : ''}">
                    ${isSelf ? '⭐' : '📍'}
                    <div class="marker-label">${name}</div>
                </div>
            `;

            const customIcon = L.divIcon({
                className: 'custom-retro-marker',
                html: iconHtml,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            const marker = L.marker([lat, lng], { icon: customIcon });
            markersLayer.addLayer(marker);

            if (isSelf && !window.hasCenteredInitial) {
                map.setView([lat, lng], 15);
                window.hasCenteredInitial = true;
            }
        }

        const simulatedUsers = {};
        function updateLocalMarkerSimulation(uid, name, lat, lng) {
            simulatedUsers[uid] = { name, latitude: lat, longitude: lng };
            markersLayer.clearLayers();

            // Adiciona ponto de teste simulado
            renderMarker('mock_vigilante', 'Vigilante-X', lat + 0.005, lng + 0.005, false);

            Object.keys(simulatedUsers).forEach(id => {
                const u = simulatedUsers[id];
                renderMarker(id, u.name, u.latitude, u.longitude, id === currentHeroUid);
            });
        }

        // Função global para centralizar no usuário atual (ligada ao botão CENTER LOC)
        window.centerOnMe = function() {
            if (myCurrentLatLng) {
                map.setView(myCurrentLatLng, 16, { animate: true });
                alert("Centralizando na sua localização exata.");
            } else {
                alert("Aguardando sinal do GPS...");
            }
        };
    </script>

    <!-- Demais Funções dos Botões Originais -->
    <script>
        function setTerrainMode() { alert("Modo de Terreno ativado!"); }
        function toggleView3D() { alert("Alternando para visualização 3D..."); }
        function openChat() { alert("Canal de chat aberto."); }
        function openArchive() { alert("Arquivos abertos."); }
        function shareLocation() { alert("Link copiado para compartilhamento!"); }
    </script>
</body>
</html>
